# GRUB menu for the ClaudeOS ISO.
set timeout=3
set default=0
insmod all_video

menuentry "ClaudeOS" {
    multiboot /boot/kernel.elf
    module /boot/initrd.img initrd
    boot
}

menuentry "ClaudeOS - start in GUI" {
    multiboot /boot/kernel.elf gui
    module /boot/initrd.img initrd
    boot
}

menuentry "ClaudeOS - VGA text mode (no GUI)" {
    multiboot /boot/kernel.elf
    module /boot/initrd.img initrd
    # must come after "multiboot", which sets gfxpayload from the kernel header
    set gfxpayload=text
    boot
}
